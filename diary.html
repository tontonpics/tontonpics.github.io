<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arnaud SCHEID — Photographe</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/clash-display" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #0a0a0a; --white: #ffffff; --gray: #888; --nav-h: 72px; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Clash Display', sans-serif; background: var(--white); color: var(--black); min-height: 100vh; overflow-x: hidden; }
    nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 100; background: var(--white); }
    .nav-logo, .nav-contact { font-family: 'Clash Display', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.06em; color: var(--black); text-decoration: none; text-transform: uppercase; }
    .gallery { display: flex; gap: 24px; padding: calc(var(--nav-h) + 32px) clamp(12px, calc((100vw - 600px) * 0.5), 400px) 80px; align-items: flex-start; }
    .gallery-col { display: flex; flex-direction: column; gap: 24px; flex: 1; min-width: 0; }
    .gallery-item { cursor: pointer; overflow: hidden; }
    .gallery-item img { width: 100%; display: block; }
    @media (max-width: 480px) { nav { padding: 0 20px; } }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.92); z-index: 200; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; animation: fadein 0.3s ease; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .lightbox img { max-width: 80vw; max-height: 85vh; object-fit: contain; cursor: default; }
    .lightbox-close { position: absolute; top: 28px; right: 36px; font-size: 28px; color: var(--black); cursor: pointer; font-weight: 300; line-height: 1; font-family: sans-serif; }
    .lightbox-prev, .lightbox-next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; color: var(--black); cursor: pointer; font-weight: 300; font-family: sans-serif; padding: 16px; line-height: 1; user-select: none; }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }
    footer { text-align: center; padding: 32px; font-size: 11px; letter-spacing: 0.12em; color: var(--gray); text-transform: uppercase; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Arnaud SCHEID</a>
  <div class="nav-logo dropdown">DIARY
    <a class="nav-logo dropdown-content" href="index.html">PORTFOLIO</a>
  </div>
  <a class="nav-contact" href="contact.html">Contact</a>
</nav>

<main class="gallery" id="gallery">
  <div class="gallery-col" id="col-0"></div>
  <div class="gallery-col" id="col-1"></div>
  <div class="gallery-col" id="col-2"></div>
</main>

<footer>© 2026 Arnaud SCHEID — Tous droits réservés</footer>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close">✕</span>
  <span class="lightbox-prev">&#8592;</span>
  <img id="lightbox-img" src="" alt="Vue agrandie" />
  <span class="lightbox-next">&#8594;</span>
</div>

<script>
const images = [
    "./pics/diary/img36.jpg",
    "./pics/diary/img33.jpg",
    "./pics/diary/img34.jpg",
    "./pics/diary/img37.jpg",
    "./pics/diary/img36.jpg",

];

function getColCount() {
  if (window.innerWidth <= 480) return 1;
  if (window.innerWidth <= 700) return 2;
  return 3;
}

function buildGallery() {
  const gallery = document.getElementById('gallery');
  const colCount = getColCount();
  gallery.innerHTML = '';

  const cols = [];
  for (let i = 0; i < colCount; i++) {
    const col = document.createElement('div');
    col.className = 'gallery-col';
    gallery.appendChild(col);
    cols.push(col);
  }

  images.forEach(function(src, i) {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Photo ' + (i + 1);
    img.loading = 'lazy';
    div.appendChild(img);
    cols[i % colCount].appendChild(div);
  });
}

buildGallery();

let resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildGallery, 150);
});
</script>

<script src="lightbox.js"></script>

</body>
</html>
